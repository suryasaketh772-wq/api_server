# Rate Limiting Zones (Abuse Prevention)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

upstream fastapi_backend {
    server api_server_backend:8000;
    keepalive 32;
}

upstream nextjs_dashboard {
    server api_server_dashboard:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name in production (e.g. admin.yourdomain.com)

    # Let's Encrypt ACME Challenge Route
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS (Uncomment this block in production after generating SSL keys)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # NextJS Dashboard Static & Page routing
    location / {
        proxy_pass http://nextjs_dashboard;
        proxy_http_version 1.1;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI REST endpoints
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        
        # Keepalive proxy tuning
        proxy_set_header Connection "";
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate Limiting
        limit_req zone=api_limit burst=30 nodelay;
    }

    # Client Spot updates (/ws/prices) & Admin Metrics stream (/ws/admin)
    location /ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # WebSocket Specific Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout Tuning for WebSockets to prevent early termination
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

