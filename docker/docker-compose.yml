version: '3.8'

services:
  api_server_backend:
    build:
      context: ../
      dockerfile: docker/api_server_backend.Dockerfile
    container_name: api_server_backend
    restart: always
    environment:
      - ENVIRONMENT=production
    env_file:
      - ../backend/.env
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api_server_dashboard:
    build:
      context: ../
      dockerfile: docker/api_server_dashboard.Dockerfile
    container_name: api_server_dashboard
    restart: always
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://3.93.145.57
    expose:
      - "3000"
    depends_on:
      - api_server_backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api_server_nginx:
    image: nginx:1.27-alpine
    container_name: api_server_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api_server_backend
      - api_server_dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
